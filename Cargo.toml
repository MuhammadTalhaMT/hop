[workspace]
resolver = "2"
members = ["crates/hop-proto", "crates/hop-core", "crates/hop-platform", "crates/hop"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/MuhammadTalhaMT/hop"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
thiserror = "2.0.20"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["net", "io-util", "rt", "macros", "time", "sync", "signal"] }
core-graphics = "0.25.0"
core-foundation = "0.10.1"
windows-sys = "0.61.2"
sha2 = "0.11.0"
toml = "1.1.4"
clap = { version = "4.6.6", features = ["derive"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
# Only for reading GitHub's release JSON in the self-updater. The HTTP
# itself is the OS's own stack (see hop-platform's windows::http), which
# is why there is no TLS crate here: every Rust TLS backend needs a C
# toolchain to cross-compile, and this project's Windows gate runs from
# the Mac.
serde_json = "1.0.151"
# hop's own window. Pure Rust with the glow backend, which matters: this
# project's Windows checks run by cross-compiling from a Mac, and a
# toolkit that compiles C does not survive that (see the updater's HTTP).
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
