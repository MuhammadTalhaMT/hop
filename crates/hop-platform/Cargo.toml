[package]
name = "hop-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hop-core = { path = "../hop-core" }
hop-proto = { path = "../hop-proto" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics.workspace = true
core-foundation.workspace = true
# Only for tokio::sync::Notify, so the tap callback can wake the server's
# connection loop the instant an event is queued instead of it polling on
# a fixed tick. Already a workspace dependency (hop and hop-core both use
# it); this just lets this crate use the same one.
tokio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
